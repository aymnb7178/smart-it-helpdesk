<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Helpdesk{% endblock %} - Smart IT Helpdesk</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --bad:#b91c1c; --ok:#15803d; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:10px 24px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
  header strong { font-size:16px; }
  header a { color:var(--ink); text-decoration:none; }
  header a:hover { color:var(--accent); }
  header form { margin-left:auto; }
  main { max-width:1100px; margin:0 auto; padding:20px 24px 40px; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; }
  .card .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .card .value { font-size:26px; font-weight:650; }
  .charts { display:grid; gap:14px; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); margin-bottom:18px; }
  .charts img { width:100%; height:auto; border:1px solid var(--line); border-radius:8px; background:#fff; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:8px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .table-wrap { overflow-x:auto; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); background:#f3f4f6; }
  .pill.critical, .pill.breached { background:#fee2e2; color:var(--bad); border-color:#fecaca; }
  .pill.high { background:#ffedd5; color:var(--warn); border-color:#fed7aa; }
  .pill.met { background:#dcfce7; color:var(--ok); border-color:#bbf7d0; }
  h1 { font-size:20px; margin:0 0 14px; } h2 { font-size:16px; margin:22px 0 10px; }
  .muted { color:var(--muted); } .notice { font-size:12px; color:var(--muted); margin-top:20px; }
  form.filters { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  select, input, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  button.link { background:none; color:var(--muted); border:none; padding:0; }
  .login { max-width:340px; margin:80px auto; }
  .login label { display:block; margin:10px 0 4px; }
  .login input { width:100%; }
  .err { color:var(--bad); }
  pre { white-space:pre-wrap; margin:0; font:inherit; }
</style>
</head>
<body>
{% if user %}
<header>
  <strong>Smart IT Helpdesk</strong>
  <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
  <a href="{{ url_for('dashboard.queue') }}">Queue</a>
  <span class="muted">{{ user.username }} ({{ user.role }})</span>
  <form method="post" action="{{ url_for('dashboard.logout') }}"><button class="link" type="submit">Sign out</button></form>
</header>
{% endif %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
